name: quality-gate
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp verify
        working-directory: backend
      - run: mvn -B -ntp -DskipTests package
        working-directory: backend

  frontend:
    strategy:
      matrix: { app: [user-web, admin-web] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/${{ matrix.app }}/package-lock.json }
      - run: npm ci
        working-directory: apps/${{ matrix.app }}
      - run: npm run lint
        working-directory: apps/${{ matrix.app }}
      - run: npm test
        working-directory: apps/${{ matrix.app }}
      - run: npm run build
        working-directory: apps/${{ matrix.app }}
      - run: npx playwright install --with-deps chromium
        working-directory: apps/${{ matrix.app }}
      - run: npm run test:e2e
        working-directory: apps/${{ matrix.app }}

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mvn -B -ntp org.owasp:dependency-check-maven:12.1.3:check -DskipTests
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: apps/user-web
      - run: npm audit --audit-level=high
        working-directory: apps/admin-web

  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: migration/requirements.txt }
      - run: pip install -r requirements.txt
        working-directory: migration
      - run: python -m unittest discover -s tests -v
        working-directory: migration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f deploy/backend.Dockerfile -t qyd/backend:ci .
      - run: docker build -f deploy/user.Dockerfile -t qyd/user-web:ci .
      - run: docker build -f deploy/admin.Dockerfile -t qyd/admin-web:ci .
