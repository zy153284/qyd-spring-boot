spring:
  datasource:
    url: jdbc:h2:mem:qyd;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
qyd:
  security:
    jwt:
      secret: test-only-jwt-secret-with-at-least-thirty-two-bytes
      access-ttl: PT15M
      refresh-ttl: P30D
